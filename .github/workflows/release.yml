name: Publish Spectrumizer release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 2.0.2)"
        required: true
        default: "2.0.2"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v${VERSION#v}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target main --title "Spectrumizer $TAG" --generate-notes
