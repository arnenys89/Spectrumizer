name: Publish Spectrumizer release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view v2.0.0 >/dev/null 2>&1 || gh release create v2.0.0 --target main --title "Spectrumizer v2.0.0" --generate-notes
